  <script type="application/json" id="exemplo-json">{"versao_schema":"1.0","prova":{"instituicao":"EXEMPLO-SP","ano":2024,"nome":"EXEMPLO-SP 2024 - Primeira Fase (fictícia)","id":"exemplo-sp-2024"},"questoes":[{"id":"exemplo-sp-2024-q001","numero":1,"area":"Pediatria","subarea":"Infectologia","foco":"Doenças Exantemáticas","enunciado":"Lactente de 14 meses, sem vacinação recente, apresenta febre alta há 3 dias. No quarto dia a febre cessa abruptamente e surge exantema maculopapular róseo, iniciado no tronco, com bom estado geral. Qual é o diagnóstico mais provável?","alternativas":[{"letra":"A","texto":"Sarampo","comentario":"No sarampo o exantema surge junto com a febre, acompanhado de tosse, coriza e conjuntivite — o oposto do quadro descrito."},{"letra":"B","texto":"Rubéola"},{"letra":"C","texto":"Exantema súbito (roséola infantum)","comentario":"No exantema súbito (HHV-6) a febre alta dura cerca de 3 dias e cessa de forma abrupta; só então surge o exantema róseo, com bom estado geral."},{"letra":"D","texto":"Escarlatina"}],"gabarito":"C","anulada":false,"comentario":"O exantema súbito, causado pelo herpesvírus humano 6, cursa com febre alta por cerca de 3 dias que cessa e, só então, surge o exantema. A: o sarampo tem exantema concomitante à febre, tosse, coriza e conjuntivite. B: a rubéola evolui com febre baixa e linfonodomegalia retroauricular. D: a escarlatina cursa com faringoamigdalite e exantema áspero, 'em lixa'.","imagens":[],"confianca_classificacao":"alta"},{"id":"exemplo-sp-2024-q002","numero":2,"area":"Clínica Médica","subarea":"Cardiologia","foco":"Hipertensão Arterial Sistêmica","enunciado":"Mulher de 58 anos, diabética e hipertensa, com pressão arterial de 152/94 mmHg em duas consultas, em uso apenas de medidas não farmacológicas. Qual é a classe de anti-hipertensivo mais adequada para iniciar, considerando a presença de diabetes e albuminúria?","alternativas":[{"letra":"A","texto":"Inibidor da enzima conversora de angiotensina (IECA) ou bloqueador do receptor de angiotensina (BRA)"},{"letra":"B","texto":"Betabloqueador não seletivo isolado"},{"letra":"C","texto":"Alfa-agonista central isolado"},{"letra":"D","texto":"Vasodilatador direto isolado"},{"letra":"E","texto":"Antagonista do cálcio de ação curta"}],"gabarito":"A","anulada":false,"comentario":"Em pacientes diabéticos com albuminúria, IECA ou BRA oferecem nefroproteção além do controle pressórico, sendo a escolha inicial preferencial. B, C, D e E não têm benefício renal comparável; o antagonista do cálcio de ação curta ainda é desaconselhado pelo risco de eventos cardiovasculares.","imagens":[],"confianca_classificacao":"alta"},{"id":"exemplo-sp-2024-q003","numero":3,"area":"Ginecologia e Obstetrícia","subarea":"Acompanhamento Gestacional","foco":"Pré-Natal","enunciado":"Gestante de 28 semanas, Rh negativo, não sensibilizada (Coombs indireto negativo), com parceiro Rh positivo. Qual é a conduta recomendada nesta consulta de pré-natal?","alternativas":[{"letra":"A","texto":"Nenhuma conduta, apenas repetir o Coombs indireto no parto"},{"letra":"B","texto":"Administrar imunoglobulina anti-D"},{"letra":"C","texto":"Indicar amniocentese para pesquisa de anemia fetal"},{"letra":"D","texto":"Realizar transfusão intrauterina"}],"gabarito":"B","anulada":false,"comentario":"Em gestante Rh negativo não sensibilizada, com parceiro Rh positivo ou desconhecido, indica-se imunoglobulina anti-D por volta de 28 semanas (profilaxia), repetindo-se após o parto se o recém-nascido for Rh positivo. A: não há razão para esperar o parto. C e D: dizem respeito a gestantes já sensibilizadas, o que não é o caso.","imagens":[{"arquivo":"exemplo-sp-2024-q003-img1.png","posicao":"enunciado","legenda":"Imagem de exemplo (quadrado cinza) para testar o envio ao Drive"}],"confianca_classificacao":"media"}]}</script>

/**
 * Rode UMA vez (menu Executar \u2192 setup) a partir do script vinculado \xE0 planilha.
 * Cria as abas, as pastas do Drive e o token secreto (veja o Registro de execu\xE7\xE3o).
 */
function setup() {
  var planilha = SpreadsheetApp.getActiveSpreadsheet();
  if (!planilha) throw new Error('Abra o script a partir da planilha (Extens\xF5es \u2192 Apps Script) e rode setup() de novo.');
  var props = PropertiesService.getScriptProperties();
  props.setProperty('SPREADSHEET_ID', planilha.getId());
  _ss = planilha;

  Object.keys(ABAS).forEach(function (nome) { garantirAba_(planilha, nome); });
  planilha.getSheets().forEach(function (sh) {
    if (!ABAS[sh.getName()] && sh.getLastRow() === 0 && sh.getLastColumn() === 0 && planilha.getSheets().length > 1) planilha.deleteSheet(sh);
  });

  var raiz = pastaFilha_(DriveApp.getRootFolder(), 'BancoQuestoes');
  var imagens = pastaFilha_(raiz, 'imagens');
  var tmp = pastaFilha_(raiz, '_tmp');
  props.setProperties({ PASTA_IMAGENS: imagens.getId(), PASTA_TMP: tmp.getId() });

  var token = props.getProperty('TOKEN');
  if (!token) {
    token = (Utilities.getUuid() + Utilities.getUuid()).replace(/-/g, '');
    props.setProperty('TOKEN', token);
  }
  upsertConfig_('versao_schema', '1.0');
  Logger.log('Setup conclu\xEDdo.\\nTOKEN (cole em config.js do site): ' + token + '\\nPasta de imagens no Drive: BancoQuestoes/imagens');
  return { ok: true, token: token };
}

/** Mostra o token atual no Registro de execu\xE7\xE3o. */
function mostrarToken() {
  Logger.log('TOKEN: ' + PropertiesService.getScriptProperties().getProperty('TOKEN'));
}

/** Gera um token novo (o antigo deixa de funcionar; atualize config.js do site). */
function gerarNovoToken() {
  var token = (Utilities.getUuid() + Utilities.getUuid()).replace(/-/g, '');
  PropertiesService.getScriptProperties().setProperty('TOKEN', token);
  Logger.log('NOVO TOKEN: ' + token);
}

function garantirAba_(planilha, nome) {
  var def = ABAS[nome];
  var sh = planilha.getSheetByName(nome) || planilha.insertSheet(nome);
  if (sh.getLastRow() === 0) sh.getRange(1, 1, 1, def.cols.length).setValues([def.cols]);
  def.cols.forEach(function (c, i) {
    if (def.num.indexOf(c) < 0) sh.getRange(1, i + 1, sh.getMaxRows(), 1).setNumberFormat('@'); // texto puro: preserva "01", datas ISO e "=..."
  });
  sh.setFrozenRows(1);
  sh.getRange(1, 1, 1, def.cols.length).setFontWeight('bold');
  return sh;
}

function pastaFilha_(pai, nome) {
  var it = pai.getFoldersByName(nome);

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Taxonomia \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

/** Retorna as quest\xF5es completas (com cache por quest\xE3o). Ausentes viram null. */
function questoes_(ids) {
  var cache = CacheService.getScriptCache(), chaves = ids.map(function (id) { return 'q:' + id; }), hit = {};
  try { hit = cache.getAll(chaves); } catch (e) { hit = {}; }
  var map = idMap_(), sh = null, faltam = [];

  // Leitura em bloco: uma \xFAnica chamada \xE0 planilha cobrindo as linhas que faltam (se forem pr\xF3ximas)

    var fim = Math.max.apply(null, faltam);

  }

    if (bloco) lin = bloco[pos - ini];

    var q = linhaParaQuestao_(lin);

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Estado do usu\xE1rio \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Filtros e listagem \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

  var out = [];
  for (var i = 0; i < idx.length; i++) {

    if (insts.length && insts.indexOf(q[I_INST]) < 0) continue;
    if (anos.length && anos.indexOf(q[I_ANO]) < 0) continue;
    if (areas.length && areas.indexOf(q[I_AREA]) < 0) continue;
    if (subs.length && subs.indexOf(q[I_SUB]) < 0) continue;

}

  });

    provas: Object.keys(provas).map(function (k) { return provas[k]; }).sort(function (a, b) { return a.instituicao < b.instituicao ? -1 : a.instituicao > b.instituicao ? 1 : b.ano - a.ano; }),
    areas: areas

    return res;
  }
  lista = ordenar_(lista, 'prova');
  var tam = Math.min(Math.max(Number(p.tamanho) || 50, 1), 200), pag = Math.max(Number(p.pagina) || 1, 1), est = estadoUsuario_(u);

  res.tamanho = tam;
  res.itens = lista.slice((pag - 1) * tam, pag * tam).map(function (q) {
    var id = q[I_ID], r = est.r[id];
    return {
      id: id, provaId: q[I_PROVA], instituicao: q[I_INST], ano: q[I_ANO], numero: q[I_NUM],
      area: q[I_AREA], subarea: q[I_SUB], foco: q[I_FOCO], anulada: !!q[I_ANUL],
      status: r ? (r[1] === 1 ? 'certa' : r[1] === 0 ? 'errada' : 'anulada') : 'nova',
      favorita: !!est.f[id], revisar: !!est.v[id]
    };
  });
  if (p.facetas) res.facetas = facetas_();
  return res;
}

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Quest\xF5es \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

/**
 * payload: { id | ids[], revelar: false | 'respondidas' | true, contextoId? }
 * Gabarito/coment\xE1rio s\xF3 saem quando permitido; em sess\xE3o "prova" aberta nunca saem.
 */
function buscarQuestoes_(u, p) {
  var ids = lista_(p.ids !== undefined ? p.ids : p.id).map(String);
  if (!ids.length) throw erro_('Informe id ou ids.');
  if (ids.length > MAX_IDS_BUSCA) throw erro_('No m\xE1ximo ' + MAX_IDS_BUSCA + ' quest\xF5es por chamada.');
  var ses = p.contextoId ? sessao_(u, String(p.contextoId)) : null;
  var bloqueado = !!(ses && ses.config.modo === 'prova' && !ses.fim);
  var est = estadoUsuario_(u), notas = notasUsuario_(u, ids), qs = questoes_(ids), itens = [];
  qs.forEach(function (q) {
    if (!q) return;
    var r = est.r[q.id];
    var revelar = !bloqueado && (p.revelar === true || (p.revelar === 'respondidas' && !!r));
    var o = JSON.parse(JSON.stringify(q));
    if (!revelar) {
      delete o.gabarito;
      delete o.comentario;
      o.alternativas = o.alternativas.map(function (a) { return { letra: a.letra, texto: a.texto }; });
      o.imagens = o.imagens.filter(function (im) { return im.posicao !== 'comentario'; });
    }
    o.revelado = revelar;
    o.estado = {
      marcada: r ? r[0] : null, correta: r ? (r[1] === 2 ? null : r[1] === 1) : null, tentativas: r ? r[2] : 0,
      favorita: !!est.f[q.id], revisar: !!est.v[q.id], nota: notas[q.id] ? notas[q.id].texto : ''
    };
    itens.push(o);
  });
  return { itens: itens };
}

function responder_(u, p) {
  var q = questao_(p.questaoId);
  if (!q) throw erro_('Quest\xE3o n\xE3o encontrada.');
  var alt = str_(p.alternativa).toUpperCase();
  if (q.alternativas.map(function (a) { return a.letra; }).indexOf(alt) < 0) throw erro_('Alternativa inv\xE1lida.');
  var ses = p.contextoId ? sessao_(u, String(p.contextoId)) : null;
  if (p.contextoId && !ses) throw erro_('Sess\xE3o n\xE3o encontrada.');
  if (ses && ses.fim) throw erro_('Esta sess\xE3o j\xE1 foi finalizada.');
  if (ses && ses.ids.indexOf(q.id) < 0) throw erro_('A quest\xE3o n\xE3o pertence a esta sess\xE3o.');
  var ctx = !ses ? 'livre' : (ses.tipo === 'trilha' ? 'trilha' : 'simulado');
  var c = q.anulada ? '' : (alt === q.gabarito ? 1 : 0);
  var tempo = Math.max(0, Math.min(Math.round(Number(p.tempoSeg) || 0), 86400));
  var oculto = !!(ses && ses.config.modo === 'prova');
  comLock_(function () {
    anexar_(sh_('Respostas'), [[u, q.id, alt, c, tempo, ctx, ses ? ses.id : '', agora_()]]);
    if (!oculto) {
      atualizarEstado_(u, function (e) { var a = e.r[q.id]; e.r[q.id] = [alt, c === '' ? 2 : c, (a ? a[2] : 0) + 1]; });
    }
  });
  if (oculto) return { registrado: true };
  return { registrado: true, correta: c === '' ? null : c === 1, anulada: q.anulada, gabarito: q.gabarito, comentario: q.comentario, alternativas: q.alternativas, imagensComentario: q.imagens.filter(function (im) { return im.posicao === 'comentario'; }) };
}

function favoritar_(u, p) {
  var id = String(p.questaoId);
  if (idMap_()[id] === undefined) throw erro_('Quest\xE3o n\xE3o encontrada.');
  return comLock_(function () {
    var sh = sh_('Favoritas'), d = lerTudo_('Favoritas'), pos = -1;
    for (var i = 0; i < d.length; i++) if (String(d[i][0]) === u && String(d[i][1]) === id) { pos = i; break; }
    var quer = (p.valor === undefined || p.valor === null) ? pos < 0 : !!p.valor;
    if (quer && pos < 0) anexar_(sh, [[u, id, agora_()]]);
    else if (!quer && pos >= 0) sh.deleteRow(pos + 2);
    atualizarEstado_(u, function (e) { if (quer) e.f[id] = 1; else delete e.f[id]; });
    return { favorita: quer };
  });
}

function salvarAnotacao_(u, p) {
  var id = String(p.questaoId), texto = String(p.texto || '').slice(0, 5000), revisar = p.revisar ? 1 : 0;
  if (idMap_()[id] === undefined) throw erro_('Quest\xE3o n\xE3o encontrada.');
  return comLock_(function () {
    var sh = sh_('Anotacoes'), d = lerTudo_('Anotacoes'), pos = -1;
    for (var i = 0; i < d.length; i++) if (String(d[i][0]) === u && String(d[i][1]) === id) { pos = i; break; }
    if (!texto && !revisar) { if (pos >= 0) sh.deleteRow(pos + 2); }
    else if (pos >= 0) sh.getRange(pos + 2, 3, 1, 2).setValues([[texto, revisar]]);
    else anexar_(sh, [[u, id, texto, revisar]]);
    atualizarEstado_(u, function (e) { if (revisar) e.v[id] = 1; else delete e.v[id]; });
    return { salvo: true, revisar: !!revisar };
  });
}

function reportarProblema_(u, p) {
  var id = String(p.questaoId), texto = String(p.texto || '').trim().slice(0, 2000);
  if (idMap_()[id] === undefined) throw erro_('Quest\xE3o n\xE3o encontrada.');
  if (!texto) throw erro_('Descreva o problema.');
  comLock_(function () { anexar_(sh_('Reportes'), [[u, id, texto, agora_()]]); });
  return { registrado: true };
}

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Trilhas \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function trilhaDeLinha_(r) {
  return { id: String(r[0]), nome: String(r[2]), filtro: jsonOr_(r[3], {}), qtd: Number(r[4]) || 0, ordem: String(r[5]), criadaEm: String(r[6]) };
}

function criarTrilha_(u, p) {
  var nome = str_(p.nome).slice(0, 80);
  if (!nome) throw erro_('D\xEA um nome \xE0 trilha.');
  var qtd = Math.min(Math.max(Math.floor(Number(p.qtd) || 0), 0), 500);
  var ordem = p.ordem === 'prova' ? 'prova' : 'aleatoria';
  var filtro = p.filtro || {};
  var t = { id: novoId_('T'), nome: nome, filtro: filtro, qtd: qtd, ordem: ordem, criadaEm: agora_() };
  comLock_(function () { anexar_(sh_('Trilhas'), [[t.id, u, nome, JSON.stringify(filtro), qtd, ordem, t.criadaEm]]); });
  t.total = aplicarFiltro_(u, filtro).length;
  return t;
}

function listarTrilhas_(u) {
  return lerTudo_('Trilhas').filter(function (r) { return String(r[1]) === u; }).map(function (r) {
    var t = trilhaDeLinha_(r);
    t.total = aplicarFiltro_(u, t.filtro).length;
    return t;
  });
}

function excluirTrilha_(u, p) {
  return comLock_(function () {
    var d = lerTudo_('Trilhas');
    for (var i = 0; i < d.length; i++) {
      if (String(d[i][0]) === String(p.id) && String(d[i][1]) === u) { sh_('Trilhas').deleteRow(i + 2); return { excluida: true }; }
    }
    throw erro_('Trilha n\xE3o encontrada.');
  });
}

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Sess\xF5es (trilha / simulado / prova) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function sessaoDeLinha_(r) {
  return {
    id: String(r[0]), usuario: String(r[1]), tipo: String(r[2]), config: jsonOr_(r[3], {}) || {},
    ids: jsonOr_(r[4], []), inicio: String(r[5]), fim: String(r[6] || '')
  };
}

function linhaSessao_(id) {
  var sh = sh_('Sessoes'), n = sh.getLastRow() - 1;
  if (n < 1) return -1;
  var col = sh.getRange(2, 1, n, 1).getValues();
  for (var i = 0; i < n; i++) if (String(col[i][0]) === id) return i + 2;
  return -1;
}

function sessao_(u, id) {
  var c = cacheGet_('ses:' + id);
  if (c) return c.usuario === u ? c : null;
  var lin = linhaSessao_(id);
  if (lin < 0) return null;
  var s = sessaoDeLinha_(sh_('Sessoes').getRange(lin, 1, 1, 8).getValues()[0]);
  if (s.usuario !== u) return null;
  cachePut_('ses:' + id, s);
  return s;
}

function selecionarIds_(u, p) {
  var tipo = p.tipo, avisos = [], config = {}, ids = [];
  var cfgIn = p.config || {};
  var modoIn = p.modo || cfgIn.modo;
  var modo = modoIn === 'imediato' || modoIn === 'prova' ? modoIn : (tipo === 'trilha' ? 'imediato' : 'prova');
  config.modo = modo;
  var limiteIn = p.tempoLimiteMin !== undefined ? p.tempoLimiteMin : cfgIn.tempoLimiteMin;
  config.tempoLimiteMin = Math.max(0, Math.min(Math.floor(Number(limiteIn) || 0), 720));

  if (p.refazerDe) {
    var origem = sessao_(u, String(p.refazerDe));
    if (!origem) throw erro_('Sess\xE3o de origem n\xE3o encontrada.');
    var rel = montarRelatorio_(origem, calcularItens_(u, origem));
    ids = rel.itens.filter(function (i) { return i.c === 0; }).map(function (i) { return i.id; });
    if (!ids.length) throw erro_('N\xE3o h\xE1 quest\xF5es erradas nessa sess\xE3o.');
    config.refazerDe = origem.id;
    config.nome = 'Refazer erradas \u2014 ' + (origem.config.nome || origem.tipo);
    config.modo = p.modo === 'prova' ? 'prova' : 'imediato';
    return { ids: ids, config: config, avisos: avisos };
  }

  if (tipo === 'trilha') {
    var filtro = p.filtro, qtd = p.qtd, ordem = p.ordem, nome = p.nome;
    if (p.trilhaId) {
      var linha = lerTudo_('Trilhas').filter(function (r) { return String(r[0]) === String(p.trilhaId) && String(r[1]) === u; })[0];
      if (!linha) throw erro_('Trilha n\xE3o encontrada.');
      var t = trilhaDeLinha_(linha);
      filtro = t.filtro; qtd = t.qtd; ordem = t.ordem; nome = t.nome; config.trilhaId = t.id;
    }
    qtd = Math.min(Math.max(Math.floor(Number(qtd) || 0), 0), 500);
    var lista = ordenar_(aplicarFiltro_(u, filtro), ordem === 'prova' ? 'prova' : 'aleatoria');
    if (qtd > 0) lista = lista.slice(0, qtd);
    ids = lista.map(function (q) { return q[I_ID]; });
    config.nome = str_(nome) || 'Trilha';
    config.filtro = filtro || {}; config.qtd = qtd; config.ordem = ordem === 'prova' ? 'prova' : 'aleatoria';
  } else if (tipo === 'prova') {
    var provaId = str_(p.provaId);
    if (!provaId) throw erro_('Informe a prova.');
    var da = indice_().filter(function (q) { return q[I_PROVA] === provaId; });
    ids = ordenar_(da, 'prova').map(function (q) { return q[I_ID]; });
    config.nome = da.length ? da[0][I_INST] + ' ' + da[0][I_ANO] : provaId;
    config.provaId = provaId;
  } else if (tipo === 'simulado') {
    var cfg = p.config || {};
    var pool = aplicarFiltro_(u, cfg.filtro || {});
    var total = Math.min(Math.max(Math.floor(Number(cfg.qtd) || 20), 1), 300);
    var dist = cfg.distribuicao || null, areasSel = lista_(cfg.areas).filter(function (a) { return AREAS_VALIDAS.indexOf(a) >= 0; });
    if (!dist) {
      dist = {};
      var alvo = areasSel.length ? areasSel : null;
      if (alvo) {
        var b = Math.floor(total / alvo.length), resto = total - b * alvo.length;
        alvo.forEach(function (a, i) { dist[a] = b + (i < resto ? 1 : 0); });
      }
    }
    if (dist && Object.keys(dist).length) {
      Object.keys(dist).forEach(function (area) {
        var n = Math.max(0, Math.floor(Number(dist[area]) || 0));
        var cand = embaralhar_(pool.filter(function (q) { return q[I_AREA] === area; }));
        if (cand.length < n) avisos.push('S\xF3 h\xE1 ' + cand.length + ' quest\xF5es dispon\xEDveis em ' + area + ' (pedido: ' + n + ').');
        cand.slice(0, n).forEach(function (q) { ids.push(q[I_ID]); });
      });
      config.distribuicao = dist;
    } else {
      var todas = embaralhar_(pool).slice(0, total);
      if (todas.length < total) avisos.push('S\xF3 h\xE1 ' + todas.length + ' quest\xF5es dispon\xEDveis (pedido: ' + total + ').');
      ids = todas.map(function (q) { return q[I_ID]; });
    }
    ids = embaralhar_(ids);
    config.nome = str_(cfg.nome || p.nome) || 'Simulado';
    config.qtd = ids.length; config.areas = areasSel; config.filtro = cfg.filtro || {};
  } else {
    throw erro_('Tipo de sess\xE3o inv\xE1lido.');
  }
  if (!ids.length) throw erro_('Nenhuma quest\xE3o encontrada com esses crit\xE9rios.');
  return { ids: ids, config: config, avisos: avisos };
}

function iniciarSessao_(u, p) {
  var sel = selecionarIds_(u, p);
  var tipo = p.refazerDe ? 'trilha' : p.tipo;
  var s = { id: novoId_('S'), usuario: u, tipo: tipo, config: sel.config, ids: sel.ids, inicio: agora_(), fim: '' };
  var cfgJson = JSON.stringify(s.config), idsJson = JSON.stringify(s.ids);
  if (cfgJson.length > MAX_CELULA || idsJson.length > MAX_CELULA) throw erro_('Sess\xE3o grande demais.');
  comLock_(function () { anexar_(sh_('Sessoes'), [[s.id, u, tipo, cfgJson, idsJson, s.inicio, '', '']]); });
  cachePut_('ses:' + s.id, s);
  return { sessaoId: s.id, tipo: tipo, config: s.config, questoesIds: s.ids, inicio: s.inicio, avisos: sel.avisos };
}

function obterSessao_(u, p) {
  var s = sessao_(u, String(p.sessaoId));
  if (!s) throw erro_('Sess\xE3o n\xE3o encontrada.');
  var oculto = s.config.modo === 'prova' && !s.fim, est = {};
  lerTudo_('Respostas').forEach(function (r) {
    if (String(r[0]) === u && String(r[6]) === s.id) est[String(r[1])] = [String(r[2]), oculto || r[3] === '' ? null : Number(r[3])];
  });
  var e = estadoUsuario_(u), fav = s.ids.filter(function (id) { return e.f[id]; });
  return { id: s.id, tipo: s.tipo, config: s.config, questoesIds: s.ids, inicio: s.inicio, fim: s.fim, estado: est, favoritas: fav };
}

/** \xDAltimo resultado por quest\xE3o da sess\xE3o \u2192 [{id, marcada, gabarito, c, t}] (c: 1 certa, 0 errada, -1 branco, 2 anulada) */
function calcularItens_(u, ses) {
  var ult = {};
  lerTudo_('Respostas').forEach(function (r) {
    if (String(r[0]) === u && String(r[6]) === ses.id) ult[String(r[1])] = { alt: String(r[2]), c: r[3], t: Number(r[4]) || 0 };
  });
  var map = idMap_(), idx = indice_();
  return ses.ids.map(function (id) {
    var x = ult[id], pos = map[id], anul = pos !== undefined && idx[pos][I_ANUL] === 1;
    var c = anul ? 2 : (!x ? -1 : (x.c === '' ? 2 : Number(x.c)));
    return { id: id, marcada: x ? x.alt : '', gabarito: gabarito_(id), c: c, t: x ? x.t : 0 };
  });
}

function agregar_(itens) {
  var idx = indice_(), map = idMap_();
  var R = { total: itens.length, acertos: 0, erros: 0, brancos: 0, anuladas: 0 }, a = {}, s = {}, f = {};
  function somar(o, chave, base, i) {
    var x = o[chave] || (o[chave] = { area: base.area, subarea: base.subarea, foco: base.foco, total: 0, acertos: 0, erros: 0, brancos: 0, anuladas: 0 });
    x.total++;
    if (i.c === 1) x.acertos++; else if (i.c === 0) x.erros++; else if (i.c === -1) x.brancos++; else x.anuladas++;
  }
  itens.forEach(function (i) {
    if (i.c === 1) R.acertos++; else if (i.c === 0) R.erros++; else if (i.c === -1) R.brancos++; else R.anuladas++;
    var pos = map[i.id];
    if (pos === undefined) return;
    var q = idx[pos];
    somar(a, q[I_AREA], { area: q[I_AREA] }, i);
    somar(s, q[I_AREA] + '|' + q[I_SUB], { area: q[I_AREA], subarea: q[I_SUB] }, i);
    somar(f, q[I_AREA] + '|' + q[I_SUB] + '|' + q[I_FOCO], { area: q[I_AREA], subarea: q[I_SUB], foco: q[I_FOCO] }, i);
  });
  function fim(o) {
    return Object.keys(o).sort().map(function (k) {
      var x = o[k];
      x.perc = pct_(x.acertos, x.total - x.anuladas);
      return x;
    });
  }
  R.perc = pct_(R.acertos, R.total - R.anuladas);
  R.porArea = fim(a).sort(function (x, y) { return AREAS_VALIDAS.indexOf(x.area) - AREAS_VALIDAS.indexOf(y.area); });
  R.porSubarea = fim(s);
  R.porFoco = fim(f);
  return R;
}

function montarRelatorio_(ses, itens) {
  var idx = indice_(), map = idMap_(), R = agregar_(itens);
  var respondidas = itens.filter(function (i) { return i.c === 0 || i.c === 1; });
  var tempoTotal = itens.reduce(function (s, i) { return s + i.t; }, 0);
  R.sessaoId = ses.id; R.tipo = ses.tipo; R.nome = ses.config.nome || ''; R.config = ses.config;
  R.inicio = ses.inicio; R.fim = ses.fim || null; R.provisorio = !ses.fim;
  R.respondidas = respondidas.length;
  R.tempoTotalSeg = tempoTotal;
  R.tempoMedioSeg = respondidas.length ? Math.round(tempoTotal / respondidas.length) : 0;
  R.duracaoSeg = ses.fim ? Math.round((Date.parse(ses.fim) - Date.parse(ses.inicio)) / 1000) : null;
  R.itens = itens.map(function (i) {
    var q = map[i.id] === undefined ? null : idx[map[i.id]];
    return { id: i.id, marcada: i.marcada, gabarito: i.gabarito, c: i.c, t: i.t, numero: q ? q[I_NUM] : null, instituicao: q ? q[I_INST] : '', ano: q ? q[I_ANO] : null, area: q ? q[I_AREA] : '', subarea: q ? q[I_SUB] : '', foco: q ? q[I_FOCO] : '' };
  });
  return R;
}

function comparacao_(u, ses) {
  var out = [];
  lerTudo_('Sessoes').forEach(function (r) {
    var s = sessaoDeLinha_(r);
    if (s.usuario !== u || s.id === ses.id || s.tipo !== ses.tipo || !s.fim) return;
    var res = jsonOr_(r[7], null);
    if (!res || !res.itens) return;
    var ag = agregar_(res.itens.map(function (i) { return { id: i[0], c: i[3] }; }));
    out.push({ id: s.id, nome: s.config.nome || '', fim: s.fim, total: ag.total, acertos: ag.acertos, perc: ag.perc });
  });
  out.sort(function (a, b) { return a.fim < b.fim ? -1 : 1; });
  return out.slice(-8);
}

function finalizarSessao_(u, p) {
  var id = String(p.sessaoId);
  var rel = comLock_(function () {
    var lin = linhaSessao_(id);
    if (lin < 0) throw erro_('Sess\xE3o n\xE3o encontrada.');
    var sh = sh_('Sessoes'), linhaVals = sh.getRange(lin, 1, 1, 8).getValues()[0], ses = sessaoDeLinha_(linhaVals);
    if (ses.usuario !== u) throw erro_('Sess\xE3o n\xE3o encontrada.');
    if (ses.fim) {
      var guardado = jsonOr_(linhaVals[7], null);
      return montarRelatorio_(ses, (guardado ? guardado.itens : []).map(function (i) { return { id: i[0], marcada: i[1], gabarito: i[2], c: i[3], t: i[4] }; }));
    }
    var itens = calcularItens_(u, ses);
    ses.fim = agora_();
    var armazenado = JSON.stringify({ itens: itens.map(function (i) { return [i.id, i.marcada, i.gabarito, i.c, i.t]; }) });
    if (armazenado.length > MAX_CELULA) throw erro_('Resultado grande demais para armazenar.');
    sh.getRange(lin, 7, 1, 2).setValues([[ses.fim, armazenado]]);
    cacheDel_('ses:' + id);
